<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芒市文旅介绍</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; color: #333; }

  /* 导航栏 */
  nav {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 24px;
    background: #2c3e50;
  }
  nav .logo { color: #fff; font-size: 18px; margin-right: 24px; }
  nav a {
    color: #cfd8e0;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 4px;
  }
  nav a:hover { background: #3d5166; }
  nav a.active { background: #4a6580; color: #fff; }

  /* 内容区 */
  main { padding: 24px; }
  .page { display: none; }
  .page.active { display: block; }

  /* 首页卡片 */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 6px;
    text-decoration: none;
    color: #333;
    cursor: pointer;
  }
  .card:hover { border-color: #2c3e50; }
  .card h3 { font-size: 18px; margin-bottom: 8px; }
  .card p { color: #888; font-size: 14px; }

  /* 占位区块 */
  .placeholder {
    padding: 48px;
    border: 1px dashed #bbb;
    border-radius: 6px;
    color: #999;
    text-align: center;
  }

  /* 筛选栏 */
  .filter-bar {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-bar label { font-size: 14px; }
  .filter-bar select {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }

  /* 景点列表 */
  .room-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .room-item {
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 6px;
  }
  .room-item h4 { font-size: 16px; margin-bottom: 6px; }
  .room-item .meta { font-size: 13px; color: #666; margin-bottom: 4px; }
  .room-item .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    margin-top: 8px;
  }
  .tag.open { background: #e6f4ea; color: #1e7e34; }
  .tag.closed { background: #fdecea; color: #c0392b; }

  /* 统计区块 */
  #statsWrap { position: relative; height: 400px; }
  .empty { color: #999; padding: 24px; text-align: center; }
</style>
</head>
<body>

<nav>
  <span class="logo">芒市文旅介绍</span>
  <a href="#home" class="active" data-page="home">首页</a>
  <a href="#study" data-page="study">景点介绍</a>
  <a href="#stats" data-page="stats">美食介绍</a>
  <a href="three-d/scene.html">芒市三维</a>
</nav>

<main>
  <!-- 首页：卡片入口 -->
  <section id="home" class="page active">
    <div class="cards">
      <a class="card" data-page="study"><h3>景点介绍</h3><p>勐焕大金塔、树包塔、孔雀湖等芒市风光</p></a>
      <a class="card" data-page="stats"><h3>美食介绍</h3><p>撒撇、泡鲁达、手抓饭等地道傣味</p></a>
      <a class="card" href="three-d/scene.html"><h3>芒市三维</h3><p>三维芒市场景</p></a>
    </div>
  </section>

  <!-- 景点介绍 -->
  <section id="study" class="page">
    <div class="filter-bar">
      <label>区域：
        <select id="areaFilter">
          <option value="">全部</option>
          <option value="市区">市区</option>
          <option value="近郊">近郊</option>
        </select>
      </label>
      <label>类型：
        <select id="typeFilter">
          <option value="">全部</option>
          <option value="宗教文化">宗教文化</option>
          <option value="人文奇观">人文奇观</option>
          <option value="人文景观">人文景观</option>
          <option value="自然风光">自然风光</option>
          <option value="休闲度假">休闲度假</option>
          <option value="休闲购物">休闲购物</option>
        </select>
      </label>
    </div>
    <div id="spotList" class="room-list"></div>
  </section>

  <!-- 美食介绍 -->
  <section id="stats" class="page">
    <div id="statsWrap"><canvas id="usageChart"></canvas></div>
  </section>

  <!-- 芒市三维 -->
  <section id="campus" class="page">
    <div class="placeholder">芒市三维模块位置（占位文字，待接入）</div>
  </section>
</main>

<script>
  // 景点数据（写死）
  var spots = [
    { name: '勐焕大金塔', area: '市区', type: '宗教文化', hot: true, desc: '雷让山顶的南亚傣式金塔，芒市地标' },
    { name: '树包塔·塔包树', area: '市区', type: '人文奇观', hot: true, desc: '树塔相融两百余年的城中奇观' },
    { name: '勐巴娜西珍奇园', area: '市区', type: '人文景观', hot: false, desc: '古树名木、奇石翡翠汇聚一堂' },
    { name: '菩提寺', area: '市区', type: '宗教文化', hot: false, desc: '傣式宫殿风格的千年古寺' },
    { name: '珠宝小镇', area: '市区', type: '休闲购物', hot: false, desc: '玉石翡翠交易与文旅体验街区' },
    { name: '孔雀湖', area: '近郊', type: '自然风光', hot: true, desc: '湖光山色、绿孔雀栖息的生态景区' },
    { name: '法帕温泉', area: '近郊', type: '休闲度假', hot: false, desc: '天然露天温泉，康养度假胜地' },
    { name: '后谷咖啡庄园', area: '近郊', type: '休闲度假', hot: false, desc: '万亩咖啡园，品鉴云南小粒咖啡' }
  ];

  function renderSpots() {
    var area = document.getElementById('areaFilter').value;
    var type = document.getElementById('typeFilter').value;
    var list = spots.filter(function (r) {
      if (area && r.area !== area) return false;
      if (type && r.type !== type) return false;
      return true;
    });
    var html = list.map(function (r) {
      return '<div class="room-item">' +
        '<h4>' + r.name + '</h4>' +
        '<div class="meta">' + r.area + ' · ' + r.type + '</div>' +
        '<div class="meta">' + r.desc + '</div>' +
        (r.hot ? '<span class="tag open">必游打卡</span>' : '') +
        '</div>';
    }).join('');
    document.getElementById('spotList').innerHTML = html || '<div class="empty">无匹配景点</div>';
  }

  // 美食人气柱状图
  var foods = [
    { name: '撒撇', usage: 95 },
    { name: '泡鲁达', usage: 92 },
    { name: '傣族手抓饭', usage: 88 },
    { name: '过手米线', usage: 80 },
    { name: '景颇鬼鸡', usage: 76 },
    { name: '舂鸡脚', usage: 70 },
    { name: '烧粑粑', usage: 60 }
  ];
  var usageChart = null;
  function renderChart(data) {
    var ctx = document.getElementById('usageChart').getContext('2d');
    if (usageChart) usageChart.destroy();
    usageChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.map(function (d) { return d.name; }),
        datasets: [{
          label: '人气指数',
          data: data.map(function (d) { return d.usage; }),
          backgroundColor: '#4a6580'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  // 页面切换
  document.querySelectorAll('[data-page]').forEach(function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-page');
      switchPage(id);
    });
  });

  document.getElementById('areaFilter').addEventListener('change', renderSpots);
  document.getElementById('typeFilter').addEventListener('change', renderSpots);
  renderSpots();

  // hash 路由，支持直接访问 #study / #stats
  function switchPage(id) {
    document.querySelectorAll('.page').forEach(function (p) {
      p.classList.toggle('active', p.id === id);
    });
    document.querySelectorAll('nav a').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-page') === id);
    });
    if (id === 'stats') renderChart(foods);
  }
  function applyHash() {
    var h = (location.hash || '#home').replace('#', '');
    if (h === 'study' || h === 'stats' || h === 'home') switchPage(h);
  }
  window.addEventListener('hashchange', applyHash);
  applyHash();
</script>

</body>
</html>
